<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DM - Entrega Exclusiva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.5s ease, color 0.5s ease;
        }
        .serif-font { font-family: 'Playfair Display', serif; }
        
        /* Tema Eventos (Claro) */
        .theme-events { background-color: #FBF9F6; color: #2A2421; }
        .theme-events .thin-border { border: 0.5px solid rgba(42, 36, 33, 0.08); }
        .theme-events .text-muted { opacity: 0.6; }

        /* Tema Institucional (Escuro) */
        .theme-institutional { background-color: #0A0A0A; color: #F3F4F6; }
        .theme-institutional .thin-border { border: 0.5px solid rgba(255, 255, 255, 0.1); }
        .theme-institutional .text-muted { opacity: 0.5; }
        .theme-institutional iframe { filter: grayscale(20%); }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center py-16 px-6 theme-events" id="body-render">

    <header id="gallery-header" class="w-full max-w-5xl mx-auto flex justify-center mb-24 transition-all duration-500">
        <a href="index.html" class="text-2xl font-light tracking-[0.4em] transition-colors" id="logo-text">D M</a>
    </header>

    <main id="gallery-main" class="w-full max-w-4xl mx-auto flex flex-col items-center text-center transition-all duration-500">
        <!-- Renderizado via JS -->
    </main>

    <footer class="w-full text-center py-16 mt-auto text-[9px] uppercase tracking-widest opacity-40">
        &copy; 2026 DM Filmes. Documentando Legados.
    </footer>

    <script>
        lucide.createIcons();

        // Lógica de Diferenciação
        const content = {
            events: {
                tagline: "Wedding Film",
                title: "João & Maria",
                subtitle: "12 de Outubro de 2026 • Fazenda Boa Vista",
                video: "https://www.youtube.com/embed/ScMzIvxBSi4",
                desc: "<p>Foi uma honra registrar o início dessa nova etapa. Cada frame deste filme foi desenhado para eternizar a essência, os sorrisos e a verdade do dia de vocês.</p><p>Com carinho,<br>Equipe DM Produções.</p>",
                theme: "theme-events"
            },
            institutional: {
                tagline: "Brand Documentary",
                title: "Inovação Tech 2026",
                subtitle: "Sede Corporativa • São Paulo",
                video: "https://www.youtube.com/embed/y3CUf2GL9Bs",
                desc: "<p>Nesta produção institucional, mergulhamos na cultura da marca para traduzir valores em imagens. O foco foi a precisão técnica e o posicionamento de mercado através de uma estética cinematográfica.</p><p>Direção: Davi Marinho</p>",
                theme: "theme-institutional"
            }
        };

        function initGallery() {
            const params = new URLSearchParams(window.location.search);
            const type = params.get('type') || 'events'; // Padrão é eventos
            const data = content[type];

            if (data) {
                // Aplica o tema visual no body
                const body = document.getElementById('body-render');
                body.className = `min-h-screen flex flex-col items-center py-16 px-6 ${data.theme}`;
                
                const header = document.getElementById('gallery-header');
                const main = document.getElementById('gallery-main');

                if (type === 'events') {
                    // Layout Romântico e Centralizado para Eventos
                    header.className = "w-full max-w-5xl mx-auto flex justify-center mb-24";
                    main.className = "w-full max-w-4xl mx-auto flex flex-col items-center text-center";
                    main.innerHTML = `
                        <span class="text-[10px] uppercase tracking-[0.4em] text-muted mb-6 block">${data.tagline}</span>
                        <h1 class="text-4xl sm:text-5xl serif-font font-extralight leading-[1.2] mb-4">${data.title}</h1>
                        <p class="text-sm font-light tracking-widest text-muted mb-16">${data.subtitle}</p>

                        <div class="w-full aspect-video rounded-xl overflow-hidden thin-border shadow-2xl bg-black relative group mb-12">
                            <iframe class="w-full h-full absolute inset-0" 
                                    src="${data.video}" 
                                    title="YouTube video player" 
                                    frameborder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                    allowfullscreen>
                            </iframe>
                        </div>
                        
                        <div class="max-w-2xl text-xs sm:text-sm font-light text-muted leading-relaxed space-y-4">
                            ${data.desc}
                        </div>
                    `;
                    document.getElementById('logo-text').classList.remove('text-white');
                } else {
                    // Layout Corporativo e Grid para Institucional
                    body.className = `min-h-screen flex flex-col py-16 px-6 sm:px-12 ${data.theme}`;
                    header.className = "w-full max-w-7xl mx-auto flex justify-start mb-16";
                    main.className = "w-full max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-16 items-center mb-16";
                    main.innerHTML = `
                        <div class="lg:col-span-5 text-left space-y-8 order-2 lg:order-1">
                            <div>
                                <span class="text-[10px] uppercase tracking-[0.4em] text-muted mb-4 block">${data.tagline}</span>
                                <h1 class="text-4xl sm:text-5xl font-light leading-[1.1] mb-6 tracking-wide">${data.title}</h1>
                                <p class="text-xs sm:text-sm font-light tracking-widest text-muted border-l border-white/20 pl-4 py-1">${data.subtitle}</p>
                            </div>
                            <div class="text-xs sm:text-sm font-light text-muted leading-relaxed space-y-4 max-w-md">
                                ${data.desc}
                            </div>
                            <div class="pt-8">
                                <a href="index.html" class="inline-flex items-center gap-3 px-6 py-3 rounded-none text-[9px] font-semibold uppercase tracking-widest border border-white/20 hover:bg-white hover:text-black transition-all duration-500">
                                    Voltar ao Início
                                </a>
                            </div>
                        </div>

                        <div class="lg:col-span-7 w-full aspect-video shadow-2xl bg-black relative group order-1 lg:order-2">
                            <iframe class="w-full h-full absolute inset-0 filter grayscale-[15%]" 
                                    src="${data.video}" 
                                    title="YouTube video player" 
                                    frameborder="0" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                                    allowfullscreen>
                            </iframe>
                        </div>
                    `;
                    document.getElementById('logo-text').classList.add('text-white');
                }
            }
        }

        window.onload = initGallery;
    </script>
</body>
</html>
